# The book's lint baseline (Technique 10): golangci-lint with
# ledgerd's .golangci.yml, plus staticcheck on every module.
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: ledgerd/go.mod
          cache-dependency-path: ledgerd/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # Build the linter with the Go above, so it understands
          # the toolchain the module uses.
          install-mode: goinstall
          working-directory: ledgerd
      - name: formatting report (golangci-lint fmt)
        working-directory: ledgerd
        run: golangci-lint fmt --diff ./...

  staticcheck:
    name: staticcheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [techniques, techniques-thirdparty, ledgerd]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.mod
      # staticcheck v0.8.1 pins an x/tools that cannot read Go 1.27
      # export data ("export data version 5"), so build it against a
      # newer x/tools first.
      - name: build staticcheck
        run: |
          mkdir -p "$RUNNER_TEMP/sc" && cd "$RUNNER_TEMP/sc"
          go mod init sc
          go get honnef.co/go/tools/cmd/staticcheck@v0.8.1 golang.org/x/tools@v0.52.0
          go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
      - run: '"$RUNNER_TEMP/staticcheck" -tags integration ./...'
