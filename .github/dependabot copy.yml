# Weekly pull requests for module and action updates; CI decides.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/techniques", "/techniques-thirdparty", "/ledgerd"]
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ledgerd
    schedule:
      interval: weekly
