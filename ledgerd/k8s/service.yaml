apiVersion: v1
kind: Service
metadata:
  name: ledgerd
  labels: {app: ledgerd}
spec:
  selector: {app: ledgerd}
  ports:
    - {name: http, port: 80, targetPort: http}
    # Prometheus scrapes the pod IP on :9090 (Technique 88);
    # pprof stays on 127.0.0.1:6060, port-forward only.
    - {name: metrics, port: 9090, targetPort: metrics}
