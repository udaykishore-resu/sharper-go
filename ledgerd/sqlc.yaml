# sqlc turns internal/store/queries.sql into typed Go (Technique 56).
# Regenerate with `make gen`; CI runs `sqlc diff`.
version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/queries.sql
    gen:
      go:
        package: sqlcdb
        out: internal/store/sqlcdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
